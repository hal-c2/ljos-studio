<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ljós site</title>
    <style>
      html, body { margin: 0; }
      /* main.js gives #app the root's height, which may be taller than the
         window: then the page scrolls as a document does. */
      #app { width: 100%; height: 100vh; }
      [data-ljos-page] { overscroll-behavior: auto !important; }
      /* The `a` main.js makes of a link, over its item's box: the look is
         the item's own. */
      a[data-ljos-link] { position: absolute; inset: 0; z-index: 1; color: inherit; text-decoration: none; pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
