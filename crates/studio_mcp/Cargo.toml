[package]
name = "studio_mcp"
description = "Ljós Studio's MCP server: every Studio action as a tool over the same session the canvas uses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["native"]
# Projects in directories, the catch-up timer on a thread, and serving on
# stdio (rmcp and tokio, through `ljos_mcp_core/server`). Off on the web
# (studio_web gives a store and a timer of its own).
native = ["studio_core/fs", "ljos_mcp_core/server"]
# The loopback endpoint a running Studio serves agents on: a native window's.
http = ["ljos_mcp_core/http"]

[dependencies]
studio_core = { path = "../studio_core", default-features = false }
ljos_mcp_core.workspace = true
ljos_blocks.workspace = true
# Paths a window reads layers by.
qml_edit.workspace = true
qt_signals.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The scenarios drive the endpoint as a client does.
studio_mcp = { path = ".", features = ["http"] }
studio_preview = { path = "../studio_preview" }
cucumber.workspace = true
insta.workspace = true
regex.workspace = true
tempfile.workspace = true
tokio.workspace = true

[[test]]
name = "features"
harness = false

[lints]
workspace = true
