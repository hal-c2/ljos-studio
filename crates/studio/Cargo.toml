[package]
name = "studio"
description = "Ljós Studio: design QML apps by editing their files losslessly. `studio [DIR]` opens its window; `studio --mcp` serves its tools on stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
studio_mcp = { path = "../studio_mcp", features = ["http"] }
studio_preview = { path = "../studio_preview" }
studio_blocks = { path = "../studio_blocks" }
# The window, and `dev-qml` and `dev` so that a shell of the person's own
# (`--shell DIR`) is compiled and watched as Studio runs, as `--watch`
# watches any app: Studio ships the compiler anyway, and a shell is a
# directory of QML anyone may replace.
ljos = { workspace = true, features = ["shell", "dev-qml", "dev"] }
ljos_mcp_core.workspace = true
# Studio's own theme file, read and put on a window that watches no shell.
ljos_design.workspace = true
ljos_design_qml.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["signal"] }

[target.'cfg(unix)'.dependencies]
# Its safe `_exit`: the workspace forbids `unsafe`.
signal-hook = { version = "0.3", default-features = false }

# The shell Studio ships, compiled ahead of time against
# crates/studio_blocks/ljostypes.json: the build script runs none of
# Studio's code.
[build-dependencies]
ljos = { workspace = true, features = ["build"] }

# The budgets harness (examples/budgets.rs) drives the shipped shell on a
# window without a platform.
[dev-dependencies]
studio_core = { path = "../studio_core" }
ljos = { workspace = true, features = ["shell", "dev-qml", "testing"] }
ljos_drive.workspace = true
# A watched window in-process, for the self-reskin's numbers.
ljos_dev.workspace = true
ljos_runtime.workspace = true
ljos_quick.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
