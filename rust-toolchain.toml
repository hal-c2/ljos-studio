# The toolchain Ljós pins, for cargo run without mise (rustup reads this).
# With mise, mise.toml's `rust` decides, and it must say the same.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
# Studio's core and tools also build for a browser (`mise run check:wasm`).
targets = ["wasm32-unknown-unknown"]
