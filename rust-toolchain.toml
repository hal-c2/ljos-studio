# The toolchain Ljós pins. Without mise, rustup reads this and installs its
# lists. With mise, mise.toml's `rust` decides the version (it must say the
# same) and `mise run setup` adds the lists below with rustup.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
# Studio's core and tools also build for a browser (`mise run check:wasm`).
targets = ["wasm32-unknown-unknown"]
