# Tooling for Ljós Studio; tasks live in mise-tasks/. A fresh checkout needs
# no `mise trust`: `[settings]` and plain versions are all this file has.
# `[env]`, hooks and tool options (a `rust` with `components` or `targets`)
# would make mise refuse it, shims included, until someone trusts it.
[settings]
# Pinned tools' bin dirs go first on PATH, so `mise run` builds with rustup's pinned toolchain
# even where a system rust (e.g. /usr/bin/cargo) or an inherited mise env comes first.
activate_aggressive = true

[tools]
# mise exports RUSTUP_TOOLCHAIN, which overrides rust-toolchain.toml, so
# rustup never installs that file's components and target here:
# `mise run setup` adds them with rustup (CI runs it before the gates).
rust = "1.98.1"
# Runs the wasm build's scenarios and numbers (web/).
node = "24.21.0"
