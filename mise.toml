# Tooling for Ljós Studio; tasks live in mise-tasks/. Only plain versions:
# `[env]`, hooks and tool options (a `rust` with `components` or `targets`)
# make mise refuse this file, shims included, until someone runs
# `mise trust`, and a fresh checkout must build without that.
[tools]
# mise exports RUSTUP_TOOLCHAIN, which overrides rust-toolchain.toml, so
# rustup never installs that file's components and target here:
# `mise run setup` adds them with rustup (CI runs it before the gates).
rust = "1.98.1"
# Runs the wasm build's scenarios and numbers (web/).
node = "24.21.0"
