# Tooling for Ljós Studio; tasks live in mise-tasks/. Plain versions only: a
# tool with options, `[env]` or hooks makes mise refuse every shim here
# (cargo is one) until someone runs `mise trust`, which stops a fresh
# checkout from building. Rust's components and targets are in
# rust-toolchain.toml.
[tools]
rust = "1.98.1"
