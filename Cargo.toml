[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/hal-c2/ljos-studio"
publish = false

# Ljós's general pieces, from ljos-ui at a commit on its main branch, so a
# checkout of this repository builds on its own. To build against a local
# ljos-ui instead (to change both at once), see "Building against a local
# ljos-ui" in README.md. Every ljos-ui crate names the same `rev`: move them
# together.
[workspace.dependencies]
qml_syntax = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1" }
qml_edit = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1" }
# Which `onName` handlers an object takes: the type table cut down to
# modules, properties and signals, small enough for the web build.
qt_signals = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1" }
# Only in build scripts: the full table stays out of what ships.
qt_types = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1" }
ljos_ir = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1" }
# What a theme may say and when Ljós refuses one, judged by Ljós itself.
ljos_design = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1" }
# Puts Studio's own theme on its window when no watched session does.
ljos_design_qml = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1" }
# The protocol alone; each crate that serves or calls MCP turns on
# `server` (rmcp, tokio), `http` or `remote`, so the web build links neither.
ljos_mcp_core = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1", default-features = false }
ljos_blocks = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1", features = ["source"] }
ljos_child = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1" }
# The facade a Ljós app is written against; each crate turns on what it
# needs (the window, the compiler, the test window).
ljos = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1", default-features = false }
# What settles a scene and counts its frames, for the UI scenarios.
ljos_drive = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1" }
# The watched session the self-reskin scenarios drive in-process, the
# clock it is pumped with, and the scene a reload shows its root in.
ljos_dev = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1" }
ljos_runtime = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1" }
ljos_quick = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1" }
# The role words the driver names nodes by, for tests that find a node by
# role among several.
ljos_a11y = { git = "https://github.com/hal-c2/ljos-ui", rev = "f5266a91b0b7f6b3d2f0991b264781f11b25c8b1" }

# Pins match ljos-ui's, so the two lock files agree.
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
cucumber = "0.23.0"
insta = { version = "1.49", features = ["json"] }
png = "0.18"
regex = "1.13"
rmcp = { version = "3.5", default-features = false }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "8.2"
tempfile = "3"
thiserror = "2.0"
# The page glue of studio_web. The CLI that writes the JavaScript side must
# be this exact version (`mise run web:build` installs it).
wasm-bindgen = "=0.2.129"
js-sys = "0.3.106"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# What a page downloads: as small as the compiler makes it (`mise run
# web:build`).
# QuickJS allows a fixed 512 KiB of stack, measured from where the engine was
# made. Unoptimised frames of the engine and its toolkit use that up on the way
# to a binding deep in the shell, which then throws RangeError and keeps its old
# value: every debug gate would judge a window no release build ever shows.
[profile.dev.package."*"]
opt-level = 1

[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
