[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/hal-c2/ljos-studio"
publish = false

# Ljós's general pieces, from ljos-ui at a commit on its main branch, so a
# checkout of this repository builds on its own. To build against a local
# ljos-ui instead (to change both at once), see "Building against a local
# ljos-ui" in README.md. Every ljos-ui crate names the same `rev`: move them
# together.
[workspace.dependencies]
qml_syntax = { git = "https://github.com/hal-c2/ljos-ui", rev = "63ec3fa4ad17dbc7ed126be86796703201e30403" }
qml_edit = { git = "https://github.com/hal-c2/ljos-ui", rev = "63ec3fa4ad17dbc7ed126be86796703201e30403" }
ljos_ir = { git = "https://github.com/hal-c2/ljos-ui", rev = "63ec3fa4ad17dbc7ed126be86796703201e30403" }
ljos_mcp_core = { git = "https://github.com/hal-c2/ljos-ui", rev = "63ec3fa4ad17dbc7ed126be86796703201e30403" }
ljos_blocks = { git = "https://github.com/hal-c2/ljos-ui", rev = "63ec3fa4ad17dbc7ed126be86796703201e30403", features = ["source"] }

# Pins match ljos-ui's, so the two lock files agree.
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
cucumber = "0.23.0"
insta = { version = "1.49", features = ["json"] }
rmcp = { version = "3.5", default-features = false }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
