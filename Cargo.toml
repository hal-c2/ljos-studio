[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/hal-c2/ljos-studio"
publish = false

# Ljós's general pieces, from a checkout of ljos-ui beside this one
# (`../ljos-ui`). They become git dependencies once Ljós publishes the
# commits Studio needs; until then a path keeps both in step while the
# track lead integrates them.
[workspace.dependencies]
qml_syntax = { path = "../ljos-ui/crates/qml_syntax" }
qml_edit = { path = "../ljos-ui/crates/qml_edit" }
ljos_ir = { path = "../ljos-ui/crates/ljos_ir" }
ljos_mcp_core = { path = "../ljos-ui/crates/ljos_mcp_core" }
ljos_blocks = { path = "../ljos-ui/crates/ljos_blocks", features = ["source"] }

# Pins match ljos-ui's, so the two lock files agree.
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
cucumber = "0.23.0"
insta = { version = "1.49", features = ["json"] }
rmcp = { version = "3.5", default-features = false }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
