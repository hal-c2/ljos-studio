# Ljós comes from GitHub as a git dependency (Cargo.toml). Fetching with the
# git command line honours the user's git configuration (an `insteadOf` that
# turns https into ssh, credential helpers), which cargo's built-in git does
# not, and would then fail to authenticate.
[net]
git-fetch-with-cli = true

[term]
color = "always"

# Ljós's MCP core links tokio with the features its native servers use
# (threads, stdio), which tokio refuses to compile for wasm32 unless
# `tokio_unstable` is set. Nothing tokio does runs in Studio's wasm; this
# only lets the crate build until the core keeps its server half behind a
# feature (a request to ljos-ui, DESIGN.md section 7, S5).
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "tokio_unstable"]
